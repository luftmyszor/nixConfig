<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- NW–SE diagonal resize cursor (↖↘) – hotspot at (16, 16) centre -->
  <!-- Diagonal shaft -->
  <line x1="11" y1="11" x2="21" y2="21"
        stroke="@@FG@@" stroke-width="2" stroke-linecap="round"/>
  <!-- NW arrowhead (points top-left) -->
  <polygon points="7,7 15,9 9,15"
           fill="@@FG@@" stroke="@@BG@@" stroke-width="1" stroke-linejoin="round"/>
  <!-- SE arrowhead (points bottom-right) -->
  <polygon points="25,25 17,23 23,17"
           fill="@@FG@@" stroke="@@BG@@" stroke-width="1" stroke-linejoin="round"/>
</svg>
