<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- 4-directional move cursor – hotspot at (16, 16) centre -->
  <!-- Up arrow -->
  <polygon points="16,4 12,9 20,9"
           fill="@@FG@@" stroke="@@BG@@" stroke-width="1" stroke-linejoin="round"/>
  <rect x="15" y="9" width="2" height="5" fill="@@FG@@"/>
  <!-- Down arrow -->
  <polygon points="16,28 12,23 20,23"
           fill="@@FG@@" stroke="@@BG@@" stroke-width="1" stroke-linejoin="round"/>
  <rect x="15" y="18" width="2" height="5" fill="@@FG@@"/>
  <!-- Left arrow -->
  <polygon points="4,16 9,12 9,20"
           fill="@@FG@@" stroke="@@BG@@" stroke-width="1" stroke-linejoin="round"/>
  <rect x="9" y="15" width="5" height="2" fill="@@FG@@"/>
  <!-- Right arrow -->
  <polygon points="28,16 23,12 23,20"
           fill="@@FG@@" stroke="@@BG@@" stroke-width="1" stroke-linejoin="round"/>
  <rect x="18" y="15" width="5" height="2" fill="@@FG@@"/>
  <!-- Centre square -->
  <rect x="14" y="14" width="4" height="4" fill="@@PRIMARY@@"/>
</svg>
